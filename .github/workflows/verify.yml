name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tools/name_data/tests -p 'test_*.py'
      - run: python3 tools/name_data/validate_database.py assets/data/names.sqlite assets/data/manifest.json
      - run: flutter build apk --debug
      - run: "! rg 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
      - run: flutter build apk --release
      - run: "! rg 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
