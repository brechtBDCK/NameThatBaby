- country_code: SE
  provider: Statistics Sweden
  source_url: https://www.scb.se/
  adapter: official_ranking
  expected_format: xlsx
  enabled: true
  license_status: review_before_release
- country_code: DE
  provider: Gesellschaft für deutsche Sprache
  source_url: https://gfds.de/
  adapter: documented_fallback
  expected_format: html
  enabled: true
  license_status: review_before_release
- country_code: FR
  provider: INSEE
  source_url: https://www.insee.fr/fr/statistiques/8894961
  adapter: insee_fr
  expected_format: zip_semicolon_csv
  enabled: true
  license_status: review_before_release
  notes: National civil-registration file through 2024; values are rounded to the nearest five.
- country_code: ES
  provider: Instituto Nacional de Estadística
  source_url: https://www.ine.es/dyngs/INEbase/es/operacion.htm?c=Estadistica_C&cid=1254736177009&idp=1254735572981&menu=resultados&secc=1254736195453
  adapter: ine_es
  expected_format: annual_xlsx
  enabled: true
  license_status: review_before_release
  notes: National top-100 newborn rankings, one workbook per year (2015-2024).
- country_code: IT
  provider: ISTAT
  source_url: https://www.istat.it/dati/calcolatori/contanomi/
  adapter: istat_it
  expected_format: annual_jsonp
  enabled: true
  license_status: review_before_release
  notes: National rankings are complete through the endpoint's 100-name-per-category historical limit.
- country_code: AT
  provider: Statistics Austria
  source_url: https://data.statistik.gv.at/data/OGDEXT_VORNAMEN_1.csv
  adapter: stat_at
  expected_format: csv
  enabled: true
  license_status: review_before_release
  notes: National ranks are derived from the published district-level birth counts; source normalization groups diacritic variants.
- country_code: GB
  provider: ONS, NRS, NISRA
  source_url: https://www.ons.gov.uk/
  adapter: uk_aggregate
  expected_format: csv
  enabled: true
  license_status: review_before_release
- country_code: IE
  provider: Central Statistics Office
  source_url: https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/VSA50/CSV/1.0/en
  adapter: cso_ie
  expected_format: csv
  enabled: true
  license_status: review_before_release
  notes: National first-name counts and ranks; imports the published top 500 per category/year.
- country_code: AU
  provider: State and territory birth registries
  source_url: https://www.abs.gov.au/
  adapter: au_aggregate
  expected_format: csv
  enabled: true
  license_status: review_before_release
