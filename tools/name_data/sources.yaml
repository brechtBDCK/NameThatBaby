# Build-time sources only. No source is contacted by the installed app.
- country_code: US
  provider: Social Security Administration
  source_url: https://www.ssa.gov/oact/babynames/limits.html
  adapter: ssa_us
  expected_format: zip_csv
  enabled: true
  license_status: review_before_release
  notes: Names below the source privacy threshold are omitted.
- country_code: CA
  provider: Statistics Canada
  source_url: https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710014701
  adapter: statcan_ca
  expected_format: zip_csv
  enabled: true
  license_status: review_before_release
- country_code: BE
  provider: Statbel
  source_url: https://statbel.fgov.be/
  adapter: official_ranking
  expected_format: csv
  enabled: true
  license_status: review_before_release
- country_code: NL
  provider: Sociale Verzekeringsbank
  source_url: https://www.svb.nl/
  adapter: official_ranking
  expected_format: html_or_csv
  enabled: true
  license_status: review_before_release
- country_code: DK
  provider: Statistics Denmark
  source_url: https://www.dst.dk/en/Statistik/emner/borgere/navne/navne-til-nyfoedte
  adapter: dst_dk
  expected_format: annual_html
  enabled: true
  license_status: review_before_release
  notes: National annual top-50 newborn rankings; the published list groups spelling variants.
- country_code: NO
  provider: Statistics Norway
  source_url: https://data.ssb.no/api/v0/en/table/FornavnFodte
  adapter: ssb_no
